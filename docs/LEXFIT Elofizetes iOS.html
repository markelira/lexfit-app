<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LEXFIT — Előfizetés · iOS hi-fi · mobil + desktop</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
body{margin:0;background:#e8e6e1;font-family:-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#4a6c5e}a:hover{color:#19211e}
.stage{max-width:1400px;margin:0 auto;padding:48px 32px 80px}
.dochead{margin-bottom:36px}
.dochead .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#4a6c5e;font-weight:600}
.dochead h1{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:8px 0 0;color:#19211e}
.dochead p{max-width:64ch;color:#5c6e66;font-size:14px;margin:10px 0 0;line-height:1.5}
.devrow{display:flex;gap:56px;flex-wrap:wrap;align-items:flex-start;justify-content:center}
.devcol{display:flex;flex-direction:column;gap:14px;align-items:center}
.devlbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#5c6e66;font-weight:600}
.devlbl b{color:#19211e}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel">
const T = {
  tint: '#4a6c5e', tintBg: '#e1f1ea',
  label: '#000', sec: 'rgba(60,60,67,0.6)', ter: 'rgba(60,60,67,0.3)',
  sep: 'rgba(60,60,67,0.12)', card: '#fff', bg: '#F2F2F7',
};
const SF = { fontFamily: '-apple-system, system-ui, sans-serif' };

function LexMark({ size = 64 }) {
  return (
    <div style={{ width: size, height: size, borderRadius: size * 0.24, background: T.tint,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      boxShadow: '0 8px 20px -8px rgba(24,32,29,0.5)' }}>
      <svg viewBox="0 0 680 616" width={size * 0.52} height={size * 0.47} aria-hidden="true">
        <g transform="translate(-192,-152)">
          <path d="M248 712A400 400 0 0 1 648 312" fill="none" stroke="#fff" strokeWidth="112" strokeLinecap="round"/>
          <circle cx="800" cy="224" r="72" fill="#fff"/>
        </g>
      </svg>
    </div>
  );
}

function CloseBtn() {
  return (
    <div style={{ width: 30, height: 30, borderRadius: 15, background: 'rgba(120,120,128,0.16)',
      display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
      <svg width="11" height="11" viewBox="0 0 11 11">
        <path d="M1.5 1.5l8 8M9.5 1.5l-8 8" stroke="rgba(60,60,67,0.6)" strokeWidth="2.2" strokeLinecap="round"/>
      </svg>
    </div>
  );
}

const Icons = {
  calendar: <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={T.tint} strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4M8.5 14l2.4 2.4 4.6-4.6"/></svg>,
  grid: <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={T.tint} strokeWidth="1.9" strokeLinecap="round"><rect x="3" y="3" width="8" height="8" rx="2.4"/><rect x="13" y="3" width="8" height="8" rx="2.4"/><rect x="3" y="13" width="8" height="8" rx="2.4"/><rect x="13" y="13" width="8" height="8" rx="2.4"/></svg>,
  trophy: <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={T.tint} strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"><path d="M7 4h10v6a5 5 0 01-10 0V4z"/><path d="M7 5.5H4.5a0 0 0 000 0A3.5 3.5 0 008 12.6M17 5.5h2.5A3.5 3.5 0 0116 12.6M12 15v3.5M8.5 21h7M12 18.5V21"/></svg>,
  chart: <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={T.tint} strokeWidth="1.9" strokeLinecap="round"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3.5"/></svg>,
};

function Feature({ icon, title, sub }) {
  return (
    <div style={{ display: 'flex', gap: 14, alignItems: 'center', textAlign: 'left' }}>
      <div style={{ width: 38, height: 38, borderRadius: 10, background: T.tintBg,
        display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>{icon}</div>
      <div>
        <div style={{ fontSize: 15.5, fontWeight: 600, letterSpacing: -0.3, color: T.label, lineHeight: '20px' }}>{title}</div>
        <div style={{ fontSize: 13, color: T.sec, letterSpacing: -0.1, lineHeight: '17px', marginTop: 1 }}>{sub}</div>
      </div>
    </div>
  );
}

function PlanRow({ name, sub, price, unit, selected, badge }) {
  return (
    <div style={{ position: 'relative', background: T.card, borderRadius: 14,
      border: selected ? `2px solid ${T.tint}` : '2px solid rgba(60,60,67,0.14)',
      padding: '12px 14px', display: 'flex', alignItems: 'center', gap: 12,
      boxShadow: selected ? '0 4px 14px -6px rgba(74,108,94,0.35)' : 'none' }}>
      {badge && (
        <div style={{ position: 'absolute', top: -9, right: 14, background: T.tint, color: '#fff',
          fontSize: 10, fontWeight: 700, letterSpacing: 0.4, textTransform: 'uppercase',
          padding: '2.5px 9px', borderRadius: 999 }}>{badge}</div>
      )}
      <div style={{ width: 22, height: 22, borderRadius: 11, flexShrink: 0,
        border: selected ? 'none' : '1.8px solid rgba(60,60,67,0.3)',
        background: selected ? T.tint : 'transparent',
        display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        {selected && <svg width="11" height="9" viewBox="0 0 11 9"><path d="M1 4.5L4 7.5L10 1.5" stroke="#fff" strokeWidth="2.2" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>}
      </div>
      <div style={{ flex: 1, minWidth: 0, textAlign: 'left' }}>
        <div style={{ fontSize: 16, fontWeight: 600, letterSpacing: -0.35, color: T.label }}>{name}</div>
        <div style={{ fontSize: 12.5, color: T.sec, letterSpacing: -0.1, marginTop: 1 }}>{sub}</div>
      </div>
      <div style={{ textAlign: 'right', flexShrink: 0 }}>
        <div style={{ fontSize: 16.5, fontWeight: 700, letterSpacing: -0.4, color: T.label, fontVariantNumeric: 'tabular-nums' }}>{price}</div>
        <div style={{ fontSize: 12, color: T.sec }}>{unit}</div>
      </div>
    </div>
  );
}

function OfferScreen() {
  return (
    <div style={{ ...SF, height: '100%', display: 'flex', flexDirection: 'column',
      padding: '64px 22px 30px', boxSizing: 'border-box', textAlign: 'center', background: T.bg }}>
      <div style={{ display: 'flex', justifyContent: 'flex-end' }}><CloseBtn /></div>
      <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', marginTop: 2 }}>
        <LexMark size={62} />
        <div style={{ fontSize: 26, fontWeight: 800, letterSpacing: -0.7, color: T.label, marginTop: 14 }}>A teljes LEXFIT</div>
        <div style={{ fontSize: 14.5, color: T.sec, letterSpacing: -0.2, marginTop: 4, maxWidth: 280 }}>Egy előfizetés, minden funkció. Bármikor lemondhatod.</div>
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 13, marginTop: 22, padding: '0 4px' }}>
        <Feature icon={Icons.calendar} title="8 hetes Foundation program" sub="40 vezetett edzés, a te tempódban" />
        <Feature icon={Icons.grid} title="Teljes videótár" sub="200+ edzés, szűrhetően" />
        <Feature icon={Icons.trophy} title="Minden eddigi kihívás" sub="A Szavazz Magadra archívum" />
        <Feature icon={Icons.chart} title="Haladásod, mérve" sub="Visszamérés az 5. és 8. héten" />
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 10, marginTop: 22 }}>
        <PlanRow name="Éves" sub="39 900 Ft / év · −44%" price="767 Ft" unit="/ hét" selected badge="A legjobb ár" />
        <PlanRow name="Havi" sub="Havonta megújul" price="5990 Ft" unit="/ hó" />
        <PlanRow name="Heti" sub="Első hét 490 Ft · utána 1990 Ft / hét" price="490 Ft" unit="első hét" />
      </div>
      <div style={{ marginTop: 'auto', display: 'flex', flexDirection: 'column', gap: 9 }}>
        <div style={{ height: 50, borderRadius: 14, background: T.tint, color: '#fff',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          fontSize: 17, fontWeight: 600, letterSpacing: -0.3,
          boxShadow: '0 6px 18px -6px rgba(74,108,94,0.5)' }}>Előfizetek — 39 900 Ft / év</div>
        <div style={{ fontSize: 11.5, color: T.ter, lineHeight: '15px', padding: '0 8px' }}>
          Az előfizetés automatikusan megújul, amíg le nem mondod.<br/>Bármikor lemondható · 14 napos pénzvisszafizetési garancia
        </div>
        <div style={{ display: 'flex', justifyContent: 'center', gap: 18, fontSize: 12, color: T.tint, fontWeight: 500 }}>
          <span>Vásárlás visszaállítása</span><span>Feltételek</span><span>Adatvédelem</span>
        </div>
      </div>
    </div>
  );
}

function DesktopOffer() {
  const [scale, setScale] = React.useState(1);
  const wrapRef = React.useRef(null);
  React.useLayoutEffect(() => {
    const fit = () => { if (wrapRef.current) setScale(Math.min(1, wrapRef.current.clientWidth / 1280)); };
    fit();
    window.addEventListener('resize', fit);
    return () => window.removeEventListener('resize', fit);
  }, []);
  const founder = (
    <div style={{ display: 'flex', alignItems: 'center', gap: 12, paddingTop: 18, borderTop: '1px solid rgba(24,32,29,0.12)' }}>
      <div style={{ width: 38, height: 38, borderRadius: 19, background: 'rgba(74,108,94,0.18)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4a6c5e" strokeWidth="1.8" strokeLinecap="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1.5-3.5 4.2-5 7.5-5s6 1.5 7.5 5"/></svg>
      </div>
      <div style={{ textAlign: 'left' }}>
        <div style={{ fontSize: 14, fontWeight: 700, color: '#19211e', letterSpacing: -0.2 }}>Alexa</div>
        <div style={{ fontSize: 11, color: '#44544d', letterSpacing: 0.4, textTransform: 'uppercase', fontWeight: 500 }}>Alapító · minden edzést ő vezet</div>
      </div>
    </div>
  );
  return (
    <div ref={wrapRef} style={{ width: '100%', maxWidth: 1280, height: 780 * scale }}>
    <div style={{ ...SF, width: 1280, height: 780, borderRadius: 16, overflow: 'hidden', display: 'grid',
      gridTemplateColumns: '1fr 1fr', background: '#fff',
      transform: `scale(${scale})`, transformOrigin: 'top left',
      boxShadow: '0 40px 80px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.1)' }}>
      {/* brand panel — the onboarding shell's left half, unchanged */}
      <div style={{ background: 'linear-gradient(158deg,#edf5f1 0%,#e1f1ea 48%,#d6e9e0 100%)',
        padding: '44px 52px 40px', display: 'flex', flexDirection: 'column' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
          <LexMark size={44} />
          <span style={{ fontSize: 19, fontWeight: 800, letterSpacing: -0.4, color: '#19211e' }}>LEXFIT</span>
        </div>
        <div style={{ margin: 'auto 0', textAlign: 'left' }}>
          <div style={{ fontSize: 40, fontWeight: 300, letterSpacing: -1.4, lineHeight: 1.08, color: '#19211e' }}>Megvan a heted.<b style={{ display: 'block', fontWeight: 700 }}>Már csak a kulcs kell.</b></div>
          <div style={{ fontSize: 15, color: '#44544d', lineHeight: 1.5, marginTop: 14, maxWidth: '34ch' }}>Heti 5 edzés, reggelente, csendes variációkkal — ahogy összeraktuk. Az előfizetés ezt a tervet nyitja meg.</div>
        </div>
        {founder}
      </div>
      {/* offer pane — the same component on the 480px onboarding axis */}
      <div style={{ display: 'flex', flexDirection: 'column', padding: '32px 0 36px', minWidth: 0 }}>
        <div style={{ width: 'min(480px, 100% - 96px)', margin: '0 auto', height: '100%',
          display: 'flex', flexDirection: 'column', textAlign: 'center' }}>
          <div style={{ display: 'flex', justifyContent: 'flex-end', height: 32 }}>
            <span style={{ fontSize: 14, color: 'rgba(60,60,67,0.6)', fontWeight: 500, alignSelf: 'center' }}>Később</span>
          </div>
          <div style={{ fontSize: 27, fontWeight: 800, letterSpacing: -0.7, color: T.label, marginTop: 6 }}>A teljes LEXFIT</div>
          <div style={{ fontSize: 14.5, color: T.sec, letterSpacing: -0.2, marginTop: 4 }}>Egy előfizetés, minden funkció. Bármikor lemondhatod.</div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 14, marginTop: 26, padding: '0 6px' }}>
            <Feature icon={Icons.calendar} title="8 hetes Foundation program" sub="40 vezetett edzés, a te tempódban" />
            <Feature icon={Icons.grid} title="Teljes videótár" sub="200+ edzés, szűrhetően" />
            <Feature icon={Icons.trophy} title="Minden eddigi kihívás" sub="A Szavazz Magadra archívum" />
            <Feature icon={Icons.chart} title="Haladásod, mérve" sub="Visszamérés az 5. és 8. héten" />
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10, marginTop: 26 }}>
            <PlanRow name="Éves" sub="39 900 Ft / év · −44%" price="767 Ft" unit="/ hét" selected badge="A legjobb ár" />
            <PlanRow name="Havi" sub="Havonta megújul" price="5990 Ft" unit="/ hó" />
            <PlanRow name="Heti" sub="Első hét 490 Ft · utána 1990 Ft / hét" price="490 Ft" unit="első hét" />
          </div>
          <div style={{ marginTop: 'auto', display: 'flex', flexDirection: 'column', gap: 9 }}>
            <div style={{ height: 50, borderRadius: 14, background: T.tint, color: '#fff',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              fontSize: 17, fontWeight: 600, letterSpacing: -0.3, cursor: 'default',
              boxShadow: '0 6px 18px -6px rgba(74,108,94,0.5)' }}>Előfizetek — 39 900 Ft / év</div>
            <div style={{ fontSize: 11.5, color: T.ter, lineHeight: '15px' }}>Biztonságos fizetés Stripe-on keresztül · automatikusan megújul, amíg le nem mondod · 14 napos pénzvisszafizetési garancia</div>
            <div style={{ display: 'flex', justifyContent: 'center', gap: 18, fontSize: 12, color: T.tint, fontWeight: 500 }}>
              <span>Vásárlás visszaállítása</span><span>Feltételek</span><span>Adatvédelem</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    </div>
  );
}

function Page() {
  return (
    <div className="stage">
      <div className="dochead">
        <div className="k">LEXFIT · Onboarding 10. lépés · Előfizetés</div>
        <h1>Az iOS-paywall, élesben.</h1>
        <p>A vázlat hi-fi változata a natív iOS nyelvén: SF-tipográfia, csoportosított háttér, csendes plan-sorok kiválasztási kerettel, egy tűzött gomb a pontos összeggel. A fizetés Stripe-on történik — az app soha nem kér kártyaadatot. A LEXFIT zöld a tint-szín; minden ár változatlan.</p>
      </div>
      <div className="devrow">
        <div className="devcol">
          <IOSDevice><OfferScreen /></IOSDevice>
          <div className="devlbl"><b>PW-01</b> · Mobil — ajánlat, éves kiválasztva</div>
        </div>
        <div className="devcol" style={{ maxWidth: '100%', flex: '1 1 100%', alignItems: 'stretch' }}>
          <DesktopOffer />
          <div className="devlbl"><b>PW-02</b> · Desktop — az onboarding szétválasztott képernyőjében, 480px tengelyen</div>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
</body>
</html>
