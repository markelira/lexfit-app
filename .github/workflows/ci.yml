name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:pricing
      - run: npm run test:funnel
      - run: npm run test:onboarding-draft
      # Build-time only — dummy credentials so next build succeeds without real
      # secrets (runtime env comes from Vercel). firebase-admin initializes at
      # module scope during page-data collection and cert() wants a real-format
      # PEM, so generate a throwaway RSA key on the fly.
      - name: Build
        run: |
          KEY=$(openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 2>/dev/null | awk 'BEGIN{ORS="\\n"} {print}')
          FIREBASE_ADMIN_PRIVATE_KEY="$KEY" npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "0"
          NEXT_PUBLIC_FIREBASE_APP_ID: ci
          FIREBASE_ADMIN_PROJECT_ID: ci
          FIREBASE_ADMIN_CLIENT_EMAIL: ci@ci.iam.gserviceaccount.com
