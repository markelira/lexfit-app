# Scheduled jobs that Vercel Hobby can't run (hourly / >2 crons). GitHub Actions
# schedules them for free at any interval and just hits the CRON_SECRET-guarded
# API routes. Reminders match by the hour, so Actions' scheduling delay is fine.
#
# Repo secrets required (Settings → Secrets and variables → Actions):
#   CRON_SECRET     — same value as the Vercel/production env var
#   PROD_BASE_URL   — production origin, no trailing slash (e.g. https://lexfit-app.vercel.app)
#
# NB: scheduled workflows only run from the default branch (main).
name: Cron

on:
  schedule:
    - cron: "0 * * * *"    # hourly — workout reminders
  workflow_dispatch:        # manual trigger for testing

# NB: purge-accounts (GDPR 30-day deletion — a legal obligation) moved to
# vercel.json crons: GH scheduled workflows auto-disable after 60 days of repo
# inactivity, which is unacceptable for that job. Only the low-stakes hourly
# reminder stays here (Vercel Hobby can't run hourly crons). If the project
# upgrades to Vercel Pro, move this one too and delete this workflow.

jobs:
  workout-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Fire workout reminders
        run: |
          curl -fsS -X GET "${PROD_BASE_URL}/api/cron/workout-reminders" \
            -H "Authorization: Bearer ${CRON_SECRET}"
        env:
          PROD_BASE_URL: ${{ secrets.PROD_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
